# UI trong Docker, backend native trên máy chủ (USB HID).
# Docker Desktop không passthrough USB HID — backend chạy trên host Windows, UI trong Docker.
#
# Một lệnh (khuyến nghị):
#   .\scripts\deploy-usb-windows.ps1
#
# Thủ công:
#   Terminal 1: .\scripts\start-backend-usb.ps1         # :8010
#   Terminal 2: docker compose -f docker-compose.usb-host.yml up -d --build
#
# UI: http://127.0.0.1:8080  |  API: http://127.0.0.1:8010

services:
  frontend:
    build:
      context: ./frontend
    container_name: jablotron-cms-frontend
    restart: unless-stopped
    ports:
      - "${CMS_UI_PORT:-8080}:80"
    volumes:
      - ./backend/data/nginx-ui.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
