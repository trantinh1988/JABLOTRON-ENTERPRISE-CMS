# Chế độ USB trên Windows: backend chạy native trên PC, chỉ UI trong Docker.
#
# Terminal 1:  .\scripts\start-backend-usb.ps1
# Terminal 2:  docker compose -f docker-compose.usb-host.yml up -d --build
# UI:         http://127.0.0.1:8080

services:
  frontend:
    build:
      context: ./frontend
    container_name: jablotron-cms-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./frontend/nginx.host-backend.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
