# UI Docker + backend native — Linux (network host, proxy 127.0.0.1:8010)
# Dùng bởi scripts/deploy-usb-linux.sh

services:
  frontend:
    build:
      context: ./frontend
    container_name: jablotron-cms-frontend
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./frontend/nginx.host-backend.hostnet.conf:/etc/nginx/conf.d/default.conf:ro
