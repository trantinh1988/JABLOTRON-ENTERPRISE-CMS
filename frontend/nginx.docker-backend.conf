# UI + backend cùng Docker network (docker compose --profile all-in-docker)
# proxy_pass KHÔNG kèm URI — giữ nguyên /api/... /media/... /ws/... (tránh FastAPI 404).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 256m;

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Docker DNS — backend có thể chưa sẵn lúc nginx start / đổi IP khi recreate
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/system/backup {
        set $cms_upstream http://backend:8000;
        proxy_pass $cms_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        client_max_body_size 256m;
    }

    location /api/ {
        set $cms_upstream http://backend:8000;
        proxy_pass $cms_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
        proxy_next_upstream error timeout http_502;
        proxy_next_upstream_tries 3;
        client_max_body_size 15m;
    }

    location /media/ {
        set $cms_upstream http://backend:8000;
        proxy_pass $cms_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 15m;
    }

    location /ws/ {
        set $cms_upstream http://backend:8000;
        proxy_pass $cms_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 10s;
        proxy_read_timeout 86400;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
