# Jablotron Enterprise CMS — Docker Compose (mặc định: USB workstation)
#
# Windows (USB HID thật): UI Docker, backend native :8010
#   .\scripts\deploy-usb-windows.ps1
#
# Demo không USB (backend cũng trong Docker):
#   docker compose -f docker-compose.all-in-docker.yml up -d --build
#
# Không chạy docker backend trên máy USB: tranh cms.db với backend native.

services:
  backend:
    profiles: ["all-in-docker"]
    build:
      context: ./backend
    container_name: jablotron-cms-backend
    restart: unless-stopped
    volumes:
      - ./keys:/keys:ro
      - ./backend/data:/app/data
    environment:
      CMS_USB_MOCK_MODE: "true"
      CMS_IN_DOCKER: "1"
      CMS_JABLOTRON_VENDOR_ID: "0x16D6"
      CMS_JABLOTRON_PRODUCT_ID: "0x0008"
      CMS_PUBLIC_KEY_PATH: /keys/public_key.pem
      CMS_DATABASE_URL: sqlite+aiosqlite:////app/data/cms.db
      CMS_HWID_CACHE_PATH: /app/data/hwid.cache
      CMS_CORS_ORIGINS: "http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173"
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
    container_name: jablotron-cms-frontend
    restart: unless-stopped
    ports:
      - "${CMS_UI_PORT:-8080}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # File trong git — proxy native backend :8010 (Windows USB).
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
