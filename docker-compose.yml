# Jablotron Enterprise CMS — Docker Compose
#
# ► Linux + USB thật (OptiPlex / server — mặc định):
#     docker compose up -d --build
#     Cắm USB Link Jablotron; kiểm tra: lsusb | grep -i 16d6
#
# ► Backend chạy ngoài Docker (khi container không thấy USB):
#     Terminal 1: ./scripts/start-backend-usb.sh
#     Terminal 2: docker compose -f docker-compose.usb-host.yml up -d --build
#
# ► Demo không phần cứng: đổi CMS_USB_MOCK_MODE thành "true"

services:
  backend:
    build:
      context: ./backend
    container_name: jablotron-cms-backend
    restart: unless-stopped
    volumes:
      - ./keys:/keys:ro
      - ./backend/data:/app/data
      - /dev:/dev
    environment:
      CMS_USB_MOCK_MODE: "false"
      CMS_JABLOTRON_VENDOR_ID: "0x16D6"
      CMS_JABLOTRON_PRODUCT_ID: "0x0008"
      CMS_PUBLIC_KEY_PATH: /keys/public_key.pem
      CMS_DATABASE_URL: sqlite+aiosqlite:////app/data/cms.db
      CMS_HWID_CACHE_PATH: /app/data/hwid.cache
      CMS_CORS_ORIGINS: "http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173"
    # USB HID — cần privileged + /dev/bus/usb (hidraw cho hidapi trên Linux)
    privileged: true
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
    container_name: jablotron-cms-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
