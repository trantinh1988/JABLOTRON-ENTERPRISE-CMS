# Jablotron Enterprise CMS — Docker Compose
#
# Máy USB (Windows/Linux): UI Docker + backend native :8010
#   Windows: .\scripts\deploy-usb-windows.ps1
#   Linux:   ./scripts/deploy-usb-linux.sh
#
# Backend trong Docker (mock, không USB) — chỉ khi cố ý:
#   docker compose --profile all-in-docker up -d --build
#
# Không chạy `docker compose up` kèm service backend trên máy USB:
# container đó tranh cms.db và làm nginx 502.

services:
  backend:
    profiles: ["all-in-docker"]
    build:
      context: ./backend
    container_name: jablotron-cms-backend
    restart: unless-stopped
    volumes:
      - ./keys:/keys:ro
      - ./backend/data:/app/data
      - /dev:/dev
    environment:
      CMS_USB_MOCK_MODE: "true"
      CMS_JABLOTRON_VENDOR_ID: "0x16D6"
      CMS_JABLOTRON_PRODUCT_ID: "0x0008"
      CMS_PUBLIC_KEY_PATH: /keys/public_key.pem
      CMS_DATABASE_URL: sqlite+aiosqlite:////app/data/cms.db
      CMS_HWID_CACHE_PATH: /app/data/hwid.cache
      CMS_CORS_ORIGINS: "http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173"
    privileged: true
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 8s

  frontend:
    build:
      context: ./frontend
    container_name: jablotron-cms-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${CMS_UI_PORT:-8080}:80"
    volumes:
      # File trong git — không mount backend/data/nginx-ui.conf (gitignore).
      # Docker tạo path thiếu thành thư mục → mount file trong image sẽ crash.
      - ./frontend/nginx.docker-backend.conf:/etc/nginx/conf.d/default.conf:ro
