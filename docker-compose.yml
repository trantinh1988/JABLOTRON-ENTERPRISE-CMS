services:
  backend:
    build:
      context: ./backend
    container_name: jablotron-cms-backend
    restart: unless-stopped
    volumes:
      - ./keys:/keys:ro
      - ./backend/data:/app/data
    environment:
      CMS_USB_MOCK_MODE: "false"
      CMS_JABLOTRON_VENDOR_ID: "58518"
      CMS_JABLOTRON_PRODUCT_ID: "8"
      CMS_PUBLIC_KEY_PATH: /keys/public_key.pem
      CMS_DATABASE_URL: sqlite+aiosqlite:////app/data/cms.db
      CMS_HWID_CACHE_PATH: /app/data/hwid.cache
      CMS_CORS_ORIGINS: "http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173"
    # Uncomment on Linux host when using real USB HID:
    # devices:
    #   - /dev/bus/usb
    # privileged: true
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
    container_name: jablotron-cms-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

